name: build-and-release

on:
  workflow_call:
    secrets:
      GCP_CREDENTIALS:
        required: true
    inputs:
      TAG:
        required: true
        type: string

env:
  REGION: me-west1
  REPOSITORY: ad-hatzot

jobs:
  changes:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: self-hosted
    outputs:
      folders: ${{ steps.folders.outputs.folders }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: folders
        shell: bash
        run: |
          changed_files=$(git diff --name-only \
            "${{ github.event.before }}" \
            "${{ github.sha }}")

          if [ -f "./Dockerfile" ]; then
            folders='[{"name":"${{ github.event.repository.name }}","path":"."}]'
          else
            folders=$(
              echo "$changed_files" |
              awk -F/ 'NF > 1 {print $1}' |
              sort -u |
              while read -r folder; do
                if [ -f "$folder/Dockerfile" ]; then
                  echo "$folder"
                fi
              done |
              jq -R -s -c '
                split("\n")
                | map(select(length > 0))
                | map({
                    name: .,
                    path: ("./" + .)
                  })
              '
            )
          fi

          echo "Build folders: $folders"
          echo "folders=$folders" >> "$GITHUB_OUTPUT"

  folders:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: self-hosted
    outputs:
      folders: ${{ steps.folders.outputs.folders }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: folders
        shell: bash
        run: |
          if [ -f "./Dockerfile" ]; then
            folders='[{"name":"${{ github.event.repository.name }}","path":"."}]'
          else
            folders=$(
              find . -mindepth 2 -maxdepth 2 -type f -name Dockerfile \
                -printf '%h\n' |
              sed 's|^\./||' |
              sort -u |
              jq -R -s -c '
                split("\n")
                | map(select(length > 0))
                | map({
                    name: .,
                    path: ("./" + .)
                  })
              '
            )
          fi

          echo "Build folders: $folders"
          echo "folders=$folders" >> "$GITHUB_OUTPUT"

  build:
    if: needs.changes.outputs.folders != '[]'
    runs-on: self-hosted
    needs: changes

    strategy:
      matrix:
        folder: ${{ fromJSON(needs.changes.outputs.folders) }}

    steps:
      - uses: actions/checkout@v4

      - name: GCP authentication
        uses: Devops-Had-Hatzot/ci-template/.github/actions/auth@main
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          registry: ${{ env.REGION }}-docker.pkg.dev

      - name: Build and push
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.REPOSITORY }}/${{ env.REPOSITORY }}/${{ matrix.folder.name }}"

          docker build \
            -t "$IMAGE:${{ inputs.TAG }}-pre" \
            "./${{ matrix.folder.path }}"

          docker push "$IMAGE:${{ inputs.TAG }}-pre"

  mirror:
    if: needs.changes.outputs.folders != '[]'
    runs-on: self-hosted
    needs: folders

    strategy:
      matrix:
        folder: ${{ fromJSON(needs.folders.outputs.folders) }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: GCP authentication
        uses: Devops-Had-Hatzot/ci-template/.github/actions/auth@main
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          registry: ${{ env.REGION }}-docker.pkg.dev

      - name: Find latest pre image
        shell: bash
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.REPOSITORY }}/${{ env.REPOSITORY }}/${{ matrix.folder }}"

          LATEST_PRE=$(
            gcloud artifacts docker tags list "$IMAGE" \
              --format="value(tag,createTime)" \
              --filter="tag~'-pre$'" \
              --sort-by="~createTime" |
            head -n 1 |
            awk '{print $1}'
          )

          if [ -z "$LATEST_PRE" ]; then
            echo "No pre image found for $IMAGE"
            exit 1
          fi

          echo "Latest pre image: $LATEST_PRE"

          docker pull "$IMAGE:$LATEST_PRE"

          docker tag \
            "$IMAGE:$LATEST_PRE" \
            "$IMAGE:${{ github.ref_name }}"

          docker push "$IMAGE:${{ github.ref_name }}"